Task 2: Environment Variables

"Environment Variables are named values stored in memory that can be used inside a workflow.

They help us store data once and reuse it many times."
 


name: Environment Variables

on: workflow_dispatch

# Workflow level
env:
  APP_NAME: myapp

jobs:
  build:
    runs-on: ubuntu-latest

    # Job level
    env:
