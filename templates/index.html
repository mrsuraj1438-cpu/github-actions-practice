<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DevOps Zero To Hero</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1b1f4a, #2c1e63);
            color: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #33ccff, #9966ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .batch {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid #6b6bff;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .motivation {
            font-weight: bold;
            margin-top: 10px;
            font-size: 18px;
            color: #f5f5f5;
        }

        .info {
            margin-top: 20px;
            color: #d0d0d0;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 150px;
        }

        .card h3 {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DevOps Zero To Hero</h1>

        <div class="batch">Josh Batch 10 -- Never Give Up</div>

        <div class="motivation" id="motivation"></div>

        <div class="info">
            Built • Tested • Linted • Deployed via GitHub Actions
        </div>

        <div class="cards">

            <div class="card">
                <p>Framework</p>
                <h3>Flask 3.1</h3>
            </div>

            <div class="card">
                <p>Runtime</p>
                <h3>Python 3.14</h3>
            </div>

            <div class="card">
                <p>Deploy</p>
                <h3>AWS ECS</h3>
            </div>

        </div>

        <div class="cards">

            <div class="card">
                <p>CI/CD</p>
                <h3>GitHub Actions</h3>
            </div>

        </div>

    </div>

    <script>

        const lines = [

            "Every DevOps engineer was once confused by Docker logs.",

            "Consistency beats talent in DevOps learning.",

            "Debugging pipelines today makes you a better engineer tomorrow.",

            "One commit a day builds a powerful DevOps career.",

            "Errors are not failures, they are DevOps lessons.",

            "Automation is power — keep learning.",

            "Real engineers break things and then automate the fix.",

            "Small daily progress creates strong DevOps skills.",

            "Your future DevOps job starts with today's practice.",

            "Containers, pipelines, patience — the DevOps way."

        ];

        const randomLine = lines[Math.floor(Math.random() * lines.length)];

        document.getElementById("motivation").innerText = randomLine;

    </script>

</body>

</html>
