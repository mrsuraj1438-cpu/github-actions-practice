Write in your notes: Why are labels useful when you have multiple self-hosted runners?
Ans: Labels are useful because when we have multiple self-hosted runners with different operating systems or purposes, labels help us easily identify and select the correct runner for a workflow.

Without labels it is difficult to remember which runner is Linux, Windows, or macOS.

#Step 1 – Multiple runners exist

Suppose we have 3 self-hosted runners:

Runner 1 → Linux machine

Runner 2 → Windows machine

Runner 3 → macOS machine


#Step 2 – Add labels to runners

We add labels to identify them:

Linux runner → linux-runner

Windows runner → windows-runner

macOS runner → macos-runner


Now it is easy to remember which runner is which.

#Step 3 – Use labels in workflow

In the workflow file we can specify which runner should execute the job.

Example:

jobs:
  build:
    runs-on: [self-hosted, linux-runner]

    steps:
      - uses: actions/checkout@v4
      - run: echo "Running on Linux self-hosted runner"


Example Scenario

If a job requires Linux environment, we use:

runs-on: [self-hosted, linux-runner]

If a job requires Windows environment, we use:

runs-on: [self-hosted, windows-runner]

So the job will run on the correct machine.

