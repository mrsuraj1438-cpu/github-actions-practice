Task 3: Set Up a Self-Hosted Runner
A Self-Hosted Runner is simply: A machine (your laptop, server, or cloud VM) connected to GitHub that executes workflow jobs. 

  But sometimes we need our own machine to run jobs because:

✅ Custom software installed
✅ More CPU/RAM
✅ Access to private network
✅ Long running jobs
✅ Cheaper than GitHub minutes


Go to your GitHub repo → Settings → Actions → Runners → New self-hosted runner
Choose Linux as the OS


