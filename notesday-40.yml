When a step in the workflow is missed or contains an error, the pipeline stops automatically.

To check whether the pipeline passed or failed, follow these steps:

Step 1:
Click on the Actions tab in GitHub. This page shows all workflow runs.

If the pipeline fails, you will see a ❌ red cross mark next to the workflow name.

If the pipeline passes, you will see a ✅ green check mark, which means all jobs and steps ran successfully.

When the pipeline fails, GitHub also shows which step and line caused the error.

For example, in my workflow I saw this error:

Annotations
1 error
Invalid workflow file: .github/workflows/hello2.yml#L21
You have an error in your yaml syntax on line 21

This means there is a YAML syntax error on line 21 of the file hello2.yml.

To read the error:

Open the failed workflow in the Actions tab.

Click on the workflow run.

Open the failed job or step.

Read the logs and annotations, which show the exact error message and line number.

This helps us understand why the pipeline failed and where we need to fix the code.  
