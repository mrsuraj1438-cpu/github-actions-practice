Task 3: Understand the Anatomy
Look at your workflow file and write in your notes what each key does:

on: this is use for start start your pipe line : because when developer push the code to github this key triggers to start the workflow

jobs: A job is a group of steps that perform a task : 
 example: build-->test-->deploy : this is jobs

runs-on: this key is use to where you run your jobs : basically it is machine where your jobs run the
 exmaple: runs-on: ubuntu-latest 

steps: this key is use to define which type of steps on run inside the jobs
 example: single task perform inside the job.

uses: use existing action (pre-built tool) created by someone else or github 
 examle: uses: actions/checkout@v4 --> 👉 Use the checkout action to download the repository code into the runner.

run: runs a command in the runner terminal.
 example: run: echo "Hello GitHub Actions" : this can run the ubuntu(runner)

name: (on a step) : description of the step
 example: : 
      steps:
      - name: display the name
        run: echo "hello this Suraj"


matrix: Allows a job to run multiple versions of something. also To test code across different environments.
 example: 
  strategy:
    matrix:
      python-version: [3.10, 3.11, 3.12]



