name: Docker Publish

on: workflow_dispatch
 #push:
   #branches:
    # - "**"

jobs:
 build_image: 

   runs-on: ubuntu-latest
   #env:
    #DOCKER_NAME: ${{secrets.DOCKER_USERNAME}}
    #DOCKER_API: ${{secrets.DOCKER_TOKEN}}
   steps:

     - name: Check the repo code
       uses: actions/checkout@v5

     - name: Docker build the image
       run: docker build -t mygithubimage .
       
     - name: check the images
       run: docker images

     - name: docker run
       run: docker run -d -p 5050:80 --name myci mygithubimage
       
     - name: Wait for container to start
       run: sleep 5


     - name: docker check running container
       run: docker ps

     - name: verify the port is accible 
       run: docker port myci 
     
     - name: test container end point
       run: curl -I http://localhost:5050

     - name: check the log
       run: docker logs myci

     #- name: docker login
     #  run: echo "$DOCKER_API" | docker login -u "$DOCKER_NAME" --password-stdin
     - name: docker login
       uses: docker/login-action@v4
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_TOKEN }}
         
     - name: tag the image
       run: docker tag mygithubimage mrsuraj542/mygithubimage:sha-${GITHUB_SHA::7}
       
     - name: push the image to docker hub only by the main branch
       if: github.ref == 'refs/heads/main'
       run: |
        echo "This run on the only main branch"
        docker push  mrsuraj542/mygithubimage:sha-${GITHUB_SHA::7}



      
