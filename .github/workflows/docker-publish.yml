name: Docker Publish

on:
 push:
   branches:
     - main


jobs:
 build_image: 

   runs-on: ubuntu-latest
   env:
    Docker-name: ${{secrets.DOCKER_USERNAME}}
    Docker-api: ${{secrets.DOCKER_TOKEN}}
   steps:
     - name: Check the repo code
       uses: actions/checkout@v5

     - name: Docker build the image
       run: docker build -t mygithubimage .
       
     - name: check the images
       run: docker images

     - name: docker run
       run: docker run -d -p 5050:80 --name myci mygithubimage
       
     - name: Wait for container to start
       run: sleep 5


     - name: docker check running container
       run: docker ps

     - name: verify the port is accible 
       run: docker port myci 
     
     - name: test container end point
       run: curl -i http://localhost:5050

     - name: check the log
       run: docker logs myci

     - name: docker login
       run: docker login -u $Docker-name -p $Docker-api

     - name: push the image to docker hub
       run: docker push -t mrsuraj542/mygithubimage:v1



      
