name: Docker Publish

on:
 push:
   branches:
     - main


jobs:
 build_image: 

   runs-on: ubuntu-latest
   #env:
    #DOCKER_NAME: ${{secrets.DOCKER_USERNAME}}
    #DOCKER_API: ${{secrets.DOCKER_TOKEN}}
   steps:
     - name: Check the repo code
       uses: actions/checkout@v5

     - name: Docker build the image
       run: docker build -t mygithubimage .
       
     - name: check the images
       run: docker images

     - name: docker run
       run: docker run -d -p 5050:80 --name myci mygithubimage
       
     - name: Wait for container to start
       run: sleep 5


     - name: docker check running container
       run: docker ps

     - name: verify the port is accible 
       run: docker port myci 
     
     - name: test container end point
       run: curl -i http://localhost:5050

     - name: check the log
       run: docker logs myci

     #- name: docker login
     #  run: echo "$DOCKER_API" | docker login -u "$DOCKER_NAME" --password-stdin
     - name: docker login
       uses: docker/login-action@v4
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_TOKEN }}
         
     - name: tag the image
       run: docker tag mygithubimage mrsuraj542/mygithubimage:v2
       
     - name: push the image to docker hub
       run: docker push  mrsuraj542/mygithubimage:v2



      
