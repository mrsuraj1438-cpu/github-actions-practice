name: Python Code Check

on:
    push:
        branches:
            - main

jobs:
    Syntax_check_for_python:
        runs-on: ubuntu-latest
        steps:
            - name: code check of repo
              uses: actions/checkout@v5

            - name: setup-python version(3.11)
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: update the pip and Install the dependencies
              run: |
                  python -m pip install --upgrade pip 
                  python -m pip install -r requirements.txt

            - name: check the syntax of python file
              run: flake8 app.py
