<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Zero To Hero | AlanK8s</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family: "Segoe UI", sans-serif;
background: radial-gradient(circle at top,#0b0b2d,#14144a,#1d1d5a);
color:white;
}

/* Main Container */

.container{
text-align:center;
max-width:900px;
}

/* Title */

.title{
font-size:60px;
font-weight:700;
background: linear-gradient(90deg,#22d3ee,#6366f1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* Subtitle */

.subtitle{
margin-top:15px;
font-size:18px;
padding:8px 20px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.2);
display:inline-block;
color:#cbd5f5;
}

/* Tagline */

.tagline{
margin-top:15px;
font-size:18px;
color:#94a3b8;
}

/* Cards */

.cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:40px;
}

.card{
width:180px;
padding:20px;
border-radius:12px;
background: rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter: blur(10px);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
background: rgba(255,255,255,0.08);
}

/* Card Text */

.card-title{
font-size:14px;
color:#94a3b8;
}

.card-main{
font-size:20px;
font-weight:bold;
margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">DevOps Zero To Hero</div>

<div class="subtitle">
Learning • Building • Deploying
</div>

<div class="tagline">
AlanK8s. Be part of the journey. 🚀
</div>

<div class="cards">

<div class="card">
<div class="card-title">Framework</div>
<div class="card-main">Flask</div>
</div>

<div class="card">
<div class="card-title">Runtime</div>
<div class="card-main">Python</div>
</div>

<div class="card">
<div class="card-title">Deploy</div>
<div class="card-main">Cloud</div>
</div>

<div class="card">
<div class="card-title">CI/CD</div>
<div class="card-main">GitHub Actions</div>
</div>

</div>

</div>

</body>
</html>
