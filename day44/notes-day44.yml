============================================================================================================================================================Caching in GitHub Actions

1. What is Caching?

Caching is a technique used to save dependencies or files during a workflow run so they can be reused in future runs.

Instead of downloading dependencies every time the workflow runs, GitHub restores them from the cache.

This makes the CI/CD pipeline faster.

--------------------------------------------------

2. Why do we use Caching?

Without caching:
Every workflow run downloads dependencies again.
This makes the pipeline slower.

Example:

Workflow Run 1
Download dependencies
Run job

Workflow Run 2
Download dependencies again
Run job


With caching:

Workflow Run 1
Download dependencies
Save cache

Workflow Run 2
Restore cache
Run job (faster)

Benefits:
- Faster pipelines
- Less network usage
- Efficient CI/CD

--------------------------------------------------

3. What is being Cached?

Usually dependency folders are cached.

Examples:

Python  -> ~/.cache/pip
Node.js -> node_modules
Maven   -> ~/.m2
Gradle  -> ~/.gradle

Example for Python:
The pip package cache folder (~/.cache/pip) is saved so packages do not need to be downloaded again.

--------------------------------------------------

4. Where is the Cache Stored?

The cache is stored in GitHub's cloud storage, not inside the repository.

Flow:

GitHub Runner
      ↓
Save cache
      ↓
GitHub Cache Storage
      ↓
Next Workflow Run
      ↓
Restore cache

Each workflow run uses a temporary virtual machine, so caching allows files from previous runs to be reused.

--------------------------------------------------

5. How to Use Caching in GitHub Actions

GitHub provides the action:

actions/cache

Example:

- name: Cache pip dependencies
  uses: actions/cache@v4
  with:
    path: ~/.cache/pip
    key: pip-${{ hashFiles('requirements.txt') }}

Explanation:

path
The folder that will be cached.

key
A unique identifier for the cache.

If requirements.txt changes, a new cache will be created.

--------------------------------------------------

6. Simple Caching Flow

Push Code
   ↓
Workflow Starts
   ↓
Check Cache
   ↓
Cache Found?
   ↓           ↓
Yes            No
↓              ↓
Restore Cache  Install Dependencies
               ↓
               Save Cache
               ↓
               Run Job

--------------------------------------------------

7. Short Definition

Caching in GitHub Actions saves dependencies in GitHub storage so they can be reused in future workflow runs, making the pipeline faster.





































































