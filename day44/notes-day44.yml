and check this log that time is veryimportant to checkWhen would you use artifacts in a real pipeline?

Artifacts are used when we want to save files from one job and use them later
or download them after the pipeline finishes.

For example, when a build job creates some important files like:
- log files
- build outputs
- test reports
- compiled application files

These files can be stored as artifacts so that other jobs or developers
can access them later.

Real Example:

Suppose we have a CI pipeline with two jobs:

Job 1: Build
This job builds the project and creates a log file.

Example:
build.log

Sometimes the build fails or we want to check what happened during the build.
So we upload this log file as an artifact.

Job 2: Debug / Review
Later we download that artifact and check the log file to understand the problem.

So artifacts help us:
- store important files
- share files between jobs
- debug pipeline failures
- download build results

That is why artifacts are very useful in real CI/CD pipelines.


