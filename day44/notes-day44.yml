Write in your notes: Why should you never print secrets in CI logs?

Why should you never print secrets in CI logs?

Because if you print the secret, your sensitive information can leak.
Other people can see these values in the CI/CD logs and misuse them.

These secrets can be:
- API keys
- database passwords
- access tokens
- private credentials

If someone gets these secrets they can:
- access your system
- change or delete data
- use your API services
- stop or damage your production system

That is why we should never print secrets in CI logs.

Example (Wrong Way):

- name: Print Secret
  run: echo "${{ secrets.MY_SECRET }}"

If someone checks the logs, the secret could be exposed (GitHub hides it as *** but printing secrets is still a bad practice).

Better Way:

- name: Check if secret exists
  run: |
    if [ -z "${{ secrets.MY_SECRET }}" ]; then
      echo "Secret not found"
    else
      echo "Secret is configured"
    fi


