Because GitHub runners are temporary machines.

When a job finishes:

Runner machine → deleted
Files → lost

So if you want to keep files, you must upload them as artifacts.

Reasons:

1️⃣ Save build results
2️⃣ Save logs for debugging
3️⃣ Share files between jobs
4️⃣ Download results from GitHub UI

Example:

build job → creates app.zip
