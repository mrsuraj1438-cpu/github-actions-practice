fails the pipeline if the script exits with a non-zero code:
 Key points

exit always stops the script.

The number matters:

0 → stop + success

Non-zero → stop + failure

This is why we use exit 1 (or any non-zero) to stop a pipeline in GitHub Actions when a check fails.

  Intentionally break the script — verify the pipeline goes red: yes

         Fix it — verify it goes green again: done


Compare with exit 1
echo "Hello"
exit 0   # stops script, but workflow continues → SUCCESS
echo "World"  # This never runs

Script stops at exit 0, but GitHub Actions treats it as success.

echo "Hello"
exit 1   # stops script and FAILS workflow
echo "World"  # This never runs

Script stops at exit 1, GitHub Actions fails the job.


