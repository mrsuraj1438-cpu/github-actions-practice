title: GitHub Actions Caching Notes

caching_concept:
  description: >
    Caching in GitHub Actions saves dependencies from previous workflow runs
    so they can be reused later. This reduces download time and makes the
    pipeline faster.

why_use_caching:
  - Faster CI/CD pipelines
  - Avoid downloading dependencies repeatedly
  - Reduce network usage
  - Improve workflow efficiency

where_cache_is_stored:
  description: >
    Cache is stored in GitHub Actions cloud storage.
    Each workflow run uses a temporary runner, so caching allows
    files from previous runs to be restored.

what_can_be_cached:
  python: "~/.cache/pip"
  nodejs: "node_modules"
  maven: "~/.m2"
  gradle: "~/.gradle"

basic_cache_example:
  description: Cache Python pip dependencies
  workflow_step: |
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('requirements.txt') }}

installation_example:
  description: Install dependencies from requirements file
  command: |
    pip install -r requirements.txt

multiple_requirements_files_strategy:
  description: >
    Sometimes projects contain multiple dependency files like
    requirements.txt, dev-requirements.txt, or test-requirements.txt.
    In such cases a pattern can be used to generate a combined cache key.

  cache_key_example: |
    key: pip-${{ hashFiles('**requirements*.txt') }}
   
      # when your hasfile is match then install according the need for dependency
     - name: Install dependencies
   run: pip install -r requirements.txt
  explanation: >
    This creates a cache key based on all files matching the pattern.
    If any dependency file changes, the cache will refresh.

specific_file_cache_strategy:
  description: >
    If caching is required only for a specific dependency file,
    reference that file directly in hashFiles().

  example: |
    key: pip-${{ hashFiles('dev-requirements.txt') }}

  installation: |
    pip install -r dev-requirements.txt

important_note:
  explanation: >
    hashFiles() only creates the cache key.
    The actual dependency file used depends on the pip install command.

  example: |
    pip install -r requirements.txt

simple_flow:
  steps:
    - Push code to repository
    - GitHub workflow starts
    - Cache is checked using the key
    - If cache exists → restore dependencies
    - If cache not found → install dependencies
    - Save cache for future workflow runs

short_definition: >
  GitHub Actions caching stores dependencies in GitHub storage so
  future workflow runs can reuse them and execute faster.

